name: Android CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: Shikhyy/ResilientPay
          path: core
      - name: Pin Rust Toolchain 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Run Host Tests
        run: cd core/sdk/core && cargo test

  android-compile-test:
    runs-on: ubuntu-latest
    needs: rust-host-tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
      - name: Cache Cargo/NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('**/Cargo.lock') }}
      - name: Pin Rust Toolchain 1.93.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Add Android Rust Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build Rust Library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # assuming core/ is checked out side by side
          # Need to ensure core repo is checked out here as well
          # The previous yaml didn't checkout core in this step!
      - uses: actions/checkout@v3
        with:
          repository: Shikhyy/ResilientPay
          path: core
      - name: Build Rust Native Libs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd core/sdk/core
          cargo ndk -t arm64-v8a -t x86_64 -o ../../../app/src/main/jniLibs build --release
      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleDebugAndroidTest

  android-unit-test:
    runs-on: ubuntu-latest
    needs: android-compile-test
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  android-instrumentation-test:
    runs-on: macos-latest
    needs: android-compile-test
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Instrumentation Tests (Keystore Verification)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          profile: pixel
          script: |
            java -version
            ./gradlew --version
            adb version
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.product.cpu.abi
            ./gradlew connectedAndroidTest
