name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          repository: Shikhyy/ResilientPay
          path: core
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Host Tests
        run: cd core/sdk/core && cargo test

  android-compile-test:
    runs-on: ubuntu-latest
    needs: rust-host-tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Cargo/NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Add Android Rust Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Build Rust Library
        run: |
          cd core/sdk/core
          cargo ndk -t arm64-v8a -t x86_64 -o ../../../app/src/main/jniLibs build --release
      - name: Build with Gradle
        run: ./gradlew assembleDebug

  android-unit-test:
    runs-on: ubuntu-latest
    needs: android-compile-test
    steps:
      - uses: actions/checkout@v3
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

  android-instrumentation-test:
    runs-on: macos-latest
    needs: android-compile-test
    steps:
      - uses: actions/checkout@v3
      - name: Run Instrumentation Tests (Keystore Verification)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedAndroidTest
