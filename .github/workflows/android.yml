name: Android CI

on:
  push:
    branches: [ "main", "feat/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Shikhyy/ResilientPay
          ref: main
          path: core
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run Host Tests
        run: cd core/sdk/core && cargo test

  android-build-and-test:
    runs-on: ubuntu-latest
    needs: rust-host-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true
        
      - uses: actions/checkout@v4
        with:
          repository: Shikhyy/ResilientPay
          ref: main
          path: core

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core/sdk/core -> target"
          
      - name: Build Rust Native Libs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p app/src/main/jniLibs
          cd core/sdk/core
          cargo ndk -t arm64-v8a -t x86_64 -o ../../../app/src/main/jniLibs build --release

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
